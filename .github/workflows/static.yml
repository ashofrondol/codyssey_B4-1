# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 과제 제약이 실제로 지켜지는지 검사한다.
  # README 「🧪 실행 검증 기록」에 손으로 적혀 있던 grep 들을 scripts/check.sh 로
  # 옮겨 두고 여기서 실행한다. 문서에만 적힌 규칙은 규칙이 아니라 희망이다.
  # 이 job 이 실패하면 아래 deploy 는 needs: check 때문에 아예 시작되지 않는다.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 프레임워크·빌드 도구 없이 Node 표준 기능만 쓴다(과제 제약 0.6).
      # ubuntu-latest 러너에 이미 있는 node 를 그대로 쓰므로 설치 단계가 없다.
      - name: JS 문법 검사 (node --check)
        run: |
          node --version
          for f in js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: 과제 제약 검사 (bash + grep)
        run: bash scripts/check.sh

  # Single deploy job since we're just deploying
  deploy:
    needs: check          # 검사를 통과한 커밋만 배포한다
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
