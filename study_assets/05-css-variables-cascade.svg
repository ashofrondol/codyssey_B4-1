<svg xmlns="http://www.w3.org/2000/svg" width="880" height="572" viewBox="0 0 880 572" role="img" aria-labelledby="title desc">
<title id="title">CSS 변수와 캐스케이드로 테마가 바뀌는 원리</title>
<desc id="desc">&lt;html&gt; 의 data-theme 속성이 dark 가 되면 :root 규칙과 [data-theme="dark"] 규칙이 둘 다 걸리는데, 명시도가 (0,1,0) 으로 같아 뒤에 쓴 다크 규칙이 이겨 --color-bg 가 #0f1117 로 바뀐다. body 는 var(--color-bg) 를 쓰므로 배경이 rgb(255, 255, 255) 에서 rgb(15, 17, 23) 으로 따라 바뀐다. 아래 띠는 명시도가 다를 때의 예로, .form__success[hidden] (0,2,0) 이 .form__success (0,1,0) 을 이겨 성공 배너가 숨겨진 채 유지된다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="572"/>
<text x="24" y="34" class="th">CSS 변수와 캐스케이드 — 테마가 바뀌는 원리</text>
<text x="24" y="58" class="ts">보라 = 변수를 정하는 규칙 · 노랑 = 다크에서 바뀐 값 · 파란 화살표 = 값이 흐르는 길 (굵은 선 = 다크일 때)</text>
<text x="24" y="88" class="ts tb">① html 속성</text>
<text x="192" y="88" class="ts tb">② 변수를 정하는 규칙</text>
<text x="464" y="88" class="ts tb">③ 변수를 쓰는 곳</text>
<text x="672" y="88" class="ts tb">④ 실제 배경색 (실측)</text>
<rect class="box" x="24" y="116" width="124" height="76" rx="8"/>
<text x="86" y="138" text-anchor="middle" class="mono">&lt;html</text>
<text x="86" y="157" text-anchor="middle" class="mono">data-theme=</text>
<text x="86" y="176" text-anchor="middle" class="mono">"light"&gt;</text>
<rect class="box" x="24" y="289" width="124" height="76" rx="8"/>
<text x="86" y="311" text-anchor="middle" class="mono">&lt;html</text>
<text x="86" y="330" text-anchor="middle" class="mono">data-theme=</text>
<text x="86" y="349" text-anchor="middle" class="mono">"dark"&gt;</text>
<rect class="purple" x="192" y="100" width="236" height="108" rx="8"/>
<text x="206" y="124" class="mono tb c-purple">:root</text>
<text x="206" y="145" class="ts">tokens.css:11 · 명시도 (0,1,0)</text>
<text x="206" y="172" class="mono">--color-bg: #ffffff</text>
<text x="206" y="193" class="mono">--color-text: #1a1d23</text>
<text x="310" y="238" text-anchor="middle" class="ts">소스 순서 ↓ (아래가 나중)</text>
<rect class="purple" x="192" y="256" width="236" height="142" rx="8"/>
<text x="206" y="280" class="mono tb c-purple">[data-theme="dark"]</text>
<text x="206" y="301" class="ts">tokens.css:63 · 명시도 (0,1,0)</text>
<rect class="yellow" x="200" y="312" width="220" height="50" rx="6"/>
<text x="210" y="332" class="mono">--color-bg: #0f1117</text>
<text x="210" y="352" class="mono">--color-text: #e7eaf2</text>
<text x="206" y="384" class="ts tb c-purple">동점이면 나중 규칙 승</text>
<rect class="box" x="464" y="196" width="180" height="120" rx="8"/>
<text x="478" y="220" class="mono">body {</text>
<text x="494" y="240" class="mono">background-color:</text>
<text x="494" y="260" class="mono tb">var(--color-bg);</text>
<text x="478" y="280" class="mono">}</text>
<text x="478" y="304" class="ts">base.css:29</text>
<text x="464" y="384" class="ts">다크에서 다시 정한 변수 14개 → 94곳이 함께 전환</text>
<text x="464" y="404" class="ts">(예: --color-bg 는 2곳 · 변수 37개 중 14개만 재정의)</text>
<rect class="box" x="672" y="126" width="184" height="56" rx="8"/>
<text x="764" y="148" text-anchor="middle" class="ts">라이트일 때</text>
<text x="764" y="169" text-anchor="middle" class="mono">rgb(255, 255, 255)</text>
<rect class="box" x="672" y="299" width="184" height="56" rx="8"/>
<text x="764" y="321" text-anchor="middle" class="ts">다크일 때</text>
<text x="764" y="342" text-anchor="middle" class="mono">rgb(15, 17, 23)</text>
<defs><marker id="arrow-blue-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<line class="ln ln-blue" x1="148" y1="154" x2="188" y2="154" marker-end="url(#arrow-blue)"/>
<line class="ln ln-blue" x1="148" y1="327" x2="188" y2="327" marker-end="url(#arrow-blue-b)" style="stroke-width:3.2"/>
<line class="ln ln-blue" x1="150" y1="296" x2="187" y2="200" marker-end="url(#arrow-blue)"/>
<path class="ln ln-blue" d="M428,154 L446,154 L446,228 L460,228" marker-end="url(#arrow-blue)"/>
<path class="ln ln-blue" d="M428,327 L446,327 L446,284 L460,284" marker-end="url(#arrow-blue-b)" style="stroke-width:3.2"/>
<path class="ln ln-blue" d="M644,228 L656,228 L656,154 L668,154" marker-end="url(#arrow-blue)"/>
<path class="ln ln-blue" d="M644,284 L656,284 L656,327 L668,327" marker-end="url(#arrow-blue-b)" style="stroke-width:3.2"/>
<rect class="zone" x="24" y="424" width="832" height="132" rx="12"/>
<text x="40" y="448" class="tb">명시도 예시 — 점수가 다르면 순서와 상관없이 더 구체적인 쪽이 이긴다</text>
<rect class="box" x="40" y="462" width="282" height="34" rx="6"/>
<text x="54" y="484" class="mono">.form__success { display: flex }</text>
<text x="346" y="484" text-anchor="middle" class="tb">vs</text>
<rect class="yellow" x="370" y="462" width="346" height="34" rx="6"/>
<text x="384" y="484" class="mono">.form__success[hidden] { display: none }</text>
<text x="740" y="484" class="tb">→ 숨김 유지</text>
<text x="40" y="518" class="ts">명시도 (0,1,0) · form.css:60</text>
<text x="370" y="518" class="ts">명시도 (0,2,0) · form.css:73 — 속성 [hidden] 이 한 점 더</text>
<text x="40" y="542" class="ts">실측: [hidden] 규칙을 지우면 hidden 속성이 있어도 display: flex 로 보인다</text>
</svg>
