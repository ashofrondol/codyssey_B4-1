<svg xmlns="http://www.w3.org/2000/svg" width="880" height="616" viewBox="0 0 880 616" role="img" aria-labelledby="title desc">
<title id="title">다크 모드로 본 이벤트 → 상태 → 렌더</title>
<desc id="desc">테마 버튼 클릭(theme.js:49)이 toggle 로 새 값 'dark' 를 계산하고, setState 가 state 를 바꾸자마자 render 를 불러 html 에 data-theme 를 달면 tokens.css 의 다크 변수가 적용되어 화면이 어두워진다. 그다음 toggle 의 마지막 줄(theme.js:62)이 선택을 localStorage 에 저장하고, 새로고침 때 init 이 그 값을 읽어 setState 로 복원한다. Projects 와 ContactForm 도 같은 state·setState·render 틀이며, setState 없이 state 를 직접 바꾸면 화면이 그대로다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="616"/>
<text class="th" x="24" y="34">다크 모드로 본 이벤트 → 상태 → 렌더</text>
<text class="ts" x="24" y="56">버튼 한 번 클릭이 화면 색이 되기까지 — 시계 방향으로 ①부터 읽는다</text>

<!-- ① 이벤트 (왼쪽 위) -->
<rect class="blue" x="24" y="76" width="216" height="84" rx="10"/>
<text class="th c-blue" x="40" y="102">① 이벤트</text>
<text class="ts" x="224" y="102" text-anchor="end">theme.js:49</text>
<text class="mono" x="40" y="130">click #themeToggle</text>
<text class="ts" x="40" y="150">달 아이콘 버튼 클릭</text>

<!-- ② 새 상태 계산 (오른쪽 위) -->
<rect class="blue" x="288" y="76" width="304" height="84" rx="10"/>
<text class="th c-blue" x="304" y="102">② 새 상태 계산</text>
<text class="ts" x="576" y="102" text-anchor="end">theme.js:59-60</text>
<text class="mono" x="304" y="128">toggle()</text>
<text class="mono" x="304" y="150">'light' → 'dark'</text>

<!-- ③ 상태 변경 (오른쪽 가운데) -->
<rect class="purple" x="288" y="188" width="304" height="104" rx="10"/>
<text class="th c-purple" x="304" y="214">③ 상태 변경</text>
<text class="ts" x="576" y="214" text-anchor="end">theme.js:53-56</text>
<text class="mono tb" x="304" y="240">setState({ theme })</text>
<text class="mono" x="304" y="262">state = { ...state, ...partial }</text>
<text class="mono c-purple" x="304" y="284">→ { theme: 'dark' }</text>

<!-- ④ 렌더 (오른쪽 아래) -->
<rect class="green" x="288" y="320" width="304" height="104" rx="10"/>
<text class="th c-green" x="304" y="346">④ 렌더</text>
<text class="ts" x="576" y="346" text-anchor="end">theme.js:66-73</text>
<text class="mono tb" x="304" y="372">render()</text>
<text class="mono" x="304" y="394">setAttribute('data-theme', 'dark')</text>
<text class="ts" x="304" y="414">아이콘 fa-moon → fa-sun</text>

<!-- ⑤ CSS 가 반응 (왼쪽 아래) -->
<rect class="green" x="24" y="320" width="216" height="104" rx="10"/>
<text class="th c-green" x="40" y="346">⑤ CSS 가 반응</text>
<text class="mono" x="40" y="370">[data-theme="dark"]</text>
<text class="ts" x="40" y="391">tokens.css:63</text>
<text class="mono" x="40" y="413">배경 #ffffff → #0f1117</text>

<!-- ⑥ 사용자가 봄 (왼쪽 가운데) -->
<rect class="box" x="24" y="188" width="216" height="104" rx="10"/>
<text class="th" x="40" y="214">⑥ 사용자가 봄</text>
<text class="ts" x="40" y="244">화면 전체가 어두워짐</text>
<text class="ts" x="40" y="266">다시 누르면 ①부터 반복</text>

<!-- 루프 화살표 -->
<line class="ln" x1="240" y1="118" x2="284" y2="118" marker-end="url(#arrow)"/>
<line class="ln" x1="440" y1="160" x2="440" y2="184" marker-end="url(#arrow)"/>
<line class="ln" x1="440" y1="292" x2="440" y2="316" marker-end="url(#arrow)"/>
<line class="ln" x1="288" y1="372" x2="244" y2="372" marker-end="url(#arrow)"/>
<line class="ln" x1="132" y1="320" x2="132" y2="296" marker-end="url(#arrow)"/>
<line class="ln" x1="132" y1="188" x2="132" y2="164" marker-end="url(#arrow)"/>

<!-- 저장 가지: toggle() 의 마지막 줄 -->
<line class="ln ln-purple" x1="592" y1="118" x2="608" y2="118" marker-end="url(#arrow-purple)"/>
<rect class="purple" x="612" y="76" width="244" height="100" rx="10"/>
<text class="tb c-purple" x="626" y="98">브라우저에 저장</text>
<text class="ts" x="842" y="98" text-anchor="end">theme.js:62</text>
<text class="mono" x="626" y="122">localStorage.setItem(</text>
<text class="mono" x="626" y="144">'portfolio-theme', 'dark')</text>
<text class="ts c-purple" x="626" y="166">③·④ 가 끝난 뒤 toggle() 마지막 줄</text>
<path class="ln ln-purple dash" d="M734,176 L734,240 L596,240" marker-end="url(#arrow-purple)"/>
<text class="ts c-purple" x="612" y="266">새로고침하면 init()</text>
<text class="ts c-purple" x="612" y="284">(theme.js:30) 이 읽어 ③ 으로 복원</text>

<!-- 같은 틀 -->
<text class="th" x="24" y="458">같은 틀을 쓰는 두 모듈</text>
<rect class="box" x="24" y="470" width="456" height="52" rx="8"/>
<text class="mono" x="40" y="492">Projects.state = { status, repos, activeLang, error }</text>
<text class="ts" x="40" y="512">projects.js:21-26</text>
<rect class="box" x="504" y="470" width="352" height="52" rx="8"/>
<text class="mono" x="520" y="492">ContactForm.state = { errors, status }</text>
<text class="ts" x="520" y="512">contact.js:29-32</text>

<!-- 금지된 지름길 -->
<rect class="red dash" x="24" y="538" width="832" height="36" rx="8"/>
<text class="mono" x="40" y="561">Projects.state.activeLang = 'Shell'</text>
<text class="ts c-red" x="348" y="561">setState 없이 직접 대입 → 화면 그대로 (실측)</text>

<text class="ts" x="24" y="600">파랑 = 이벤트·계산 · 보라 = 상태·저장 · 초록 = 화면 반영 · 보라 점선 = 새로고침 때만 도는 길 · 빨간 점선 상자 = 금지된 지름길</text>

</svg>
