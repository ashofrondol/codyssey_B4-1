<svg xmlns="http://www.w3.org/2000/svg" width="880" height="964" viewBox="0 0 880 964" role="img" aria-labelledby="title desc">
<title id="title">GitHub API 호출 흐름과 4상태</title>
<desc id="desc">첫 방문 때 DOMContentLoaded 에서 Projects.init() 과 fetchRepos() 가 불리고, loading 화면을 띄운 뒤 GitHub API 를 fetch 한다. res.ok 가 아니면(403·404·500) 직접 throw 하고 네트워크 실패는 fetch 가 스스로 실패해, 둘 다 catch 한 곳에서 error 화면이 되고 다시 시도 버튼이 fetchRepos() 로 돌아간다. 성공하면 fork 를 빼고 12개로 자른 뒤 0개면 empty 화면, 아니면 success 로 필터 버튼 6개와 카드 12장을 그리며, 필터 클릭은 요청 없이 다시 그리기만 한다.</desc>
