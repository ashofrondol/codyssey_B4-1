<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" aria-labelledby="title desc">
<title id="title">타이핑 효과와 fetch 대기가 함께 도는 모습</title>
<desc id="desc">메인 스레드 한 줄에서 fetchRepos 가 await fetch 에서 멈추면 그동안 타이핑 tick 태스크가 90ms 마다 실행되고, 브라우저가 응답을 받으면 Promise 가 이행되어 fetchRepos 가 마이크로태스크로 재개해 res.ok 를 검사한 뒤 다시 json 을 기다리고, 본문 파싱이 끝나면 다시 재개해 setState 로 카드를 그린다. 블록 길이는 예시다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="372"/>
<text class="th" x="24" y="34">타이핑 효과와 fetch 대기가 함께 도는 모습</text>
<text class="ts" x="24" y="56">JS 는 한 줄(메인 스레드)에서 한 번에 하나씩 · 블록 길이는 예시(실측 시간 아님)</text>

<!-- 레인 이름 -->
<text class="tb" x="24" y="104">메인 스레드</text>
<text class="ts" x="24" y="124">JS 가 실행되는 곳</text>
<text class="tb" x="24" y="190">브라우저</text>
<text class="ts" x="24" y="210">네트워크 대기</text>

<!-- 메인 스레드 블록 -->
<rect class="blue" x="196" y="88" width="120" height="48" rx="6"/>
<text class="c-blue tb" x="256" y="108" text-anchor="middle">① 요청 시작</text>
<text class="mono" x="256" y="127" text-anchor="middle">await fetch</text>
<rect class="green" x="332" y="88" width="64" height="48" rx="6"/>
<text class="mono c-green" x="364" y="117" text-anchor="middle">tick</text>
<rect class="green" x="412" y="88" width="64" height="48" rx="6"/>
<text class="mono c-green" x="444" y="117" text-anchor="middle">tick</text>
<rect class="green" x="492" y="88" width="64" height="48" rx="6"/>
<text class="mono c-green" x="524" y="117" text-anchor="middle">tick</text>
<rect class="purple" x="572" y="88" width="80" height="48" rx="6"/>
<text class="c-purple tb" x="612" y="108" text-anchor="middle">② 재개</text>
<text class="mono" x="612" y="127" text-anchor="middle">res.ok</text>
<rect class="green" x="668" y="88" width="64" height="48" rx="6"/>
<text class="mono c-green" x="700" y="117" text-anchor="middle">tick</text>
<rect class="purple" x="748" y="88" width="108" height="48" rx="6"/>
<text class="c-purple tb" x="802" y="108" text-anchor="middle">③ 재개</text>
<text class="mono" x="802" y="127" text-anchor="middle">setState</text>

<!-- 네트워크 대기 -->
<rect class="blue dash" x="300" y="176" width="288" height="32" rx="6"/>
<text class="ts c-blue" x="444" y="197" text-anchor="middle">GitHub 응답을 기다리는 중</text>
<rect class="blue dash" x="640" y="176" width="124" height="32" rx="6"/>
<text class="ts c-blue" x="702" y="197" text-anchor="middle">본문 읽기</text>

<!-- 넘겨주기 화살표 -->
<line class="ln ln-blue" x1="308" y1="138" x2="308" y2="172" marker-end="url(#arrow-blue)"/>
<line class="ln ln-purple" x1="580" y1="176" x2="580" y2="140" marker-end="url(#arrow-purple)"/>
<line class="ln ln-blue" x1="644" y1="138" x2="644" y2="172" marker-end="url(#arrow-blue)"/>
<line class="ln ln-purple" x1="756" y1="176" x2="756" y2="140" marker-end="url(#arrow-purple)"/>

<!-- 시간 축 -->
<line class="ln" x1="196" y1="234" x2="852" y2="234" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="252">시간 →</text>

<!-- 설명 -->
<text class="ts" x="24" y="282">① fetchRepos() 가 loading 을 그린 뒤 await fetch 에서 멈추고 스레드를 내놓는다 (js/projects.js:46, :50)</text>
<text class="ts" x="24" y="304">② 응답이 오면 Promise 가 이행되고, 나머지가 마이크로태스크로 재개 → res.ok 검사 → await res.json() 에서 다시 멈춤</text>
<text class="ts" x="24" y="326">③ 본문 파싱이 끝나면 다시 재개 → filter · slice → setState({ status: 'success' }) → 카드 12장</text>
<text class="ts" x="24" y="348">tick = js/typing.js 의 setTimeout(tick, 90) 이 90ms 마다 넣는 태스크 — 재개와 겹치지 않고 번갈아 실행된다</text>
</svg>
