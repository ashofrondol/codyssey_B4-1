<rect class="blue" x="236" y="364" width="352" height="76" rx="10"/>
<text x="412" y="385" text-anchor="middle" class="tb c-blue">기능 모듈 9개</text>
<text x="412" y="407" text-anchor="middle" class="mono">theme · menu · scroll · typing · skills</text>
<text x="412" y="427" text-anchor="middle" class="mono">reveal · navspy · projects · contact</text>

<line class="ln ln-blue" x1="412" y1="440" x2="412" y2="456" marker-end="url(#arrow-blue)"/>

