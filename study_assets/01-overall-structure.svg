<text class="ts" x="24" y="58"><tspan class="c-blue">파랑 = 요청·실행 순서</tspan> · <tspan class="c-purple">보라 = 브라우저 저장소</tspan> · <tspan class="c-green">초록 = 검사 통과·배포</tspan> · 회색 = 외부 CSS 불러오기</text>

