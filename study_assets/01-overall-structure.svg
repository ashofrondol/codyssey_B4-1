<line class="ln ln-green" x1="448" y1="630" x2="480" y2="630" marker-end="url(#arrow-green)"/>
<line class="ln ln-green" x1="560" y1="596" x2="560" y2="532" marker-end="url(#arrow-green)"/>
<rect class="bg" x="484" y="549" width="152" height="27"/>
<text x="560" y="568" text-anchor="middle" class="ts c-green">통과한 커밋만 게시</text>

